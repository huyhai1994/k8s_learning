# Deployment để quản lý số lượng Pod chạy ứng dụng
apiVersion: apps/v1        # API version cho Deployment
kind: Deployment           # Loại resource là Deployment
metadata:
  name: nginx-deployment   # Tên Deployment
spec:
  replicas: 3              # Số lượng Pod sẽ chạy đồng thời
  selector:
    matchLabels:
      app: nginx           # Selector để Deployment quản lý các Pod có label này
  template:                # Template để tạo Pod
    metadata:
      labels:
        app: nginx         # Label gán cho Pod, dùng để match với selector
    spec:
      containers:          # Danh sách container trong Pod
        - name: nginx      # Tên container
          image: nginx:1.16 # Docker image của container
          ports:
            - containerPort: 80 # Port mà container lắng nghe

---
# Service để expose Deployment ra bên ngoài
apiVersion: v1             # API version cho Service
kind: Service              # Loại resource là Service
metadata:
  name: nginx-service       # Tên Service
spec:
  type: LoadBalancer        # Service loại LoadBalancer (cung cấp external IP)
  ports:
    - protocol: TCP         # Giao thức TCP
      port: 3200            # Port mở ra bên ngoài cluster
      targetPort: 80        # Port trong container mà request sẽ forward tới
  selector:
    app: nginx              # Service sẽ forward request tới Pod có label này
